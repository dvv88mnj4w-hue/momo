<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日mo明日mo</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MOMO">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#3FC6C2;
    --teal-soft:#DFF6F5;
    --ink:#3E7A78;
    --pink:#FF8FAE;
    --peach1:#FFC8B0;
    --peach2:#FF9FA8;
    --leaf:#8FBF7A;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    min-height:100vh;
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--ink);
    background:#fff;
  }
  .frame{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background-image:url('frame-gingham.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    padding:60px 44px;
  }
  .frame.no-pattern{
    background-image:none;
    background-color:#fff;
  }

  .panel{
    width:100%;
    max-width:340px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:14px;
  }

  .badge{
    font-family:'Mochiy Pop One', sans-serif;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--teal);
    border:1.5px solid var(--teal);
    border-radius:999px;
    padding:8px 20px;
    line-height:1.4;
  }

  .date-tag{
    font-family:'Mochiy Pop One', sans-serif;
    font-size:22px;
    letter-spacing:0.04em;
    color:var(--teal);
  }

  .title{
    font-family:'Mochiy Pop One', sans-serif;
    font-size:44px;
    color:var(--teal);
    letter-spacing:0.02em;
  }

  .tagline{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:15px;
    line-height:1.7;
    color:var(--teal);
  }

  .result{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    min-height:70px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .5s ease .15s, transform .5s ease .15s;
  }
  .result.show{ opacity:1; transform:translateY(0); }

  .result-cat{
    font-family:'Mochiy Pop One', sans-serif;
    font-size:14px;
    color:var(--teal);
    background:var(--teal-soft);
    border:1.5px solid var(--teal);
    border-radius:999px;
    padding:7px 22px;
    letter-spacing:0.05em;
  }

  .result-quote{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size:24px;
    line-height:1.65;
    color:var(--ink);
    white-space:pre-line;
    padding:0 4px;
  }

  .result-underline{
    width:52px;
    height:4px;
    border-radius:999px;
    background:var(--pink);
    margin-top:-2px;
  }

  .result-footer{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:13px;
    color:var(--teal);
    opacity:0.9;
  }

  .peach-wrap{
    position:relative;
    width:190px;
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .peach-wrap svg{ width:100%; height:100%; overflow:visible; }

  .burst-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:visible;
  }
  .confetti-piece{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%);
  }
  .confetti-piece.star{
    width:14px; height:14px;
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .confetti-piece.ribbon{
    width:5px; height:16px;
    border-radius:3px;
  }
  .confetti-piece.char-piece{
    width:22px; height:22px;
    object-fit:contain;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));
  }

  .peach-left, .peach-right{
    transition: transform .55s cubic-bezier(.34,1.56,.64,1);
    transform-origin:60px 60px;
  }
  .peach-wrap.split .peach-left{ transform:translate(-16px,2px) rotate(-8deg); }
  .peach-wrap.split .peach-right{ transform:translate(16px,2px) rotate(8deg); }

  .sparkle{
    opacity:0;
    transform:scale(0.4);
    transition:opacity .3s ease, transform .3s ease;
  }
  .peach-wrap.split .sparkle{ opacity:1; transform:scale(1); }

  .peach-bounce{ animation:bounce 2.6s ease-in-out infinite; }
  @keyframes bounce{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-6px) rotate(-2deg); }
  }

  .tap-me{
    font-family:'Mochiy Pop One', sans-serif;
    font-size:20px;
    color:var(--teal);
  }
  .tap-me.hide{ display:none; }

  .again-note{
    font-size:12px;
    color:#8FBFBD;
    display:none;
  }
  .again-note.show{ display:block; }

  /* ---- 結果ページ（桃が割れた後の全画面メッセージ） ---- */
  .result-panel{
    display:none;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .result-panel.show{
    display:flex;
    opacity:1;
    transform:translateY(0);
  }

  .close-btn{
    position:fixed;
    top:22px;
    right:22px;
    width:36px;
    height:36px;
    border-radius:50%;
    background:#fff;
    border:1.5px solid var(--teal);
    color:var(--teal);
    font-size:18px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10;
  }

  .sound-toggle{
    position:fixed;
    top:22px;
    left:22px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--pink), var(--teal));
    border:none;
    box-shadow:0 6px 14px -6px rgba(255,111,149,0.5);
    font-size:17px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10;
  }

  .rays{
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .rays::before, .rays::after{
    content:'';
    width:16px;
    height:2px;
    border-radius:2px;
    background:var(--pink);
    opacity:0.8;
  }

  .r-header{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--teal);
  }

  .r-date-big{
    font-family:'Mochiy Pop One', sans-serif;
    font-size:52px;
    color:var(--teal);
    line-height:1;
  }
  .r-date-sub{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Mochiy Pop One', sans-serif;
    font-size:16px;
    color:var(--teal);
  }
  .r-weekday-pill{
    background:var(--teal);
    color:#fff;
    border-radius:999px;
    padding:3px 12px;
    font-size:13px;
  }

  .r-cat-pill{
    font-family:'Mochiy Pop One', sans-serif;
    font-size:20px;
    color:#fff;
    background:var(--pink);
    border-radius:999px;
    padding:10px 30px;
    letter-spacing:0.05em;
  }

  .r-quote{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size:25px;
    line-height:1.5;
    color:var(--ink);
    white-space:pre-line;
    padding:0 6px;
    width:100%;
    box-sizing:border-box;
  }

  .r-underline{
    width:60px;
    height:5px;
    border-radius:999px;
    background:var(--pink);
    margin-top:-4px;
  }

  .r-subtext{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:14px;
    line-height:1.8;
    color:var(--teal);
  }

  .r-peach-deco{
    position:relative;
    width:150px;
    height:150px;
  }
  .r-peach-deco svg{ width:100%; height:100%; overflow:visible; }

  .r-footer{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:13px;
    color:var(--teal);
  }

  .bonus-link{
    margin-top:6px;
    font-family:'Mochiy Pop One', sans-serif;
    font-size:14px;
    color:#fff;
    background:var(--teal);
    border:none;
    border-radius:999px;
    padding:12px 28px;
    cursor:pointer;
  }

  /* ---- おまけページ（川と桃） ---- */
  .bonus-panel{
    display:none;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .bonus-panel.show{
    display:flex;
    opacity:1;
    transform:translateY(0);
  }

  .river-wrap{
    position:relative;
    width:100%;
    max-width:320px;
    height:220px;
    overflow:hidden;
    border-radius:24px;
    background:linear-gradient(180deg, #EAF9F6 0%, #CFEFEA 100%);
  }
  .river{
    position:absolute;
    left:-20%;
    width:140%;
    height:56px;
    background:#8FD9C4;
    opacity:0.55;
    border-radius:50%;
  }
  .river{ top:70px; }
  .river2{ top:120px; opacity:0.4; }

  .river-item{
    position:absolute;
    width:56px;
    height:56px;
    cursor:pointer;
    z-index:3;
  }
  .river-item svg, .river-item img{ width:100%; height:100%; overflow:visible; object-fit:contain; }

  .fp-left, .fp-right{
    transition:transform .5s cubic-bezier(.34,1.56,.64,1);
    transform-origin:60px 60px;
  }
  .river-item.split .fp-left{ transform:translate(-16px,2px) rotate(-10deg); }
  .river-item.split .fp-right{ transform:translate(16px,2px) rotate(10deg); }

  .pop-mark{
    position:absolute;
    width:26px;
    height:26px;
    z-index:5;
    pointer-events:none;
    animation:popMarkFloat 1s ease-out forwards;
  }
  .pop-mark svg{ width:100%; height:100%; }
  @keyframes popMarkFloat{
    0%{ transform:translate(-50%,-50%) translateY(0) scale(0.5); opacity:0; }
    30%{ transform:translate(-50%,-50%) translateY(-10px) scale(1.15); opacity:1; }
    100%{ transform:translate(-50%,-50%) translateY(-38px) scale(1); opacity:0; }
  }

  .ending-tagline{
    text-align:center;
  }
  .ending-tagline .rays{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--teal);
  }
  .ending-sub{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--teal);
    margin-top:2px;
  }

  .speech-bubble{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%) scale(0.7);
    max-width:250px;
    background:#fff;
    border:2px solid var(--teal);
    border-radius:18px;
    padding:12px 16px;
    opacity:0;
    transition:opacity .35s ease, transform .35s ease;
    pointer-events:none;
    text-align:center;
  }
  .speech-bubble::after{
    content:'';
    position:absolute;
    bottom:-10px;
    left:50%;
    transform:translateX(-50%);
    border-width:10px 8px 0 8px;
    border-style:solid;
    border-color:var(--teal) transparent transparent transparent;
  }
  .speech-bubble.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
  }
  .speech-bubble span{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:12px;
    line-height:1.6;
    color:var(--ink);
  }

  .bonus-hint{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:13px;
    color:var(--teal);
    opacity:0.85;
  }

  /* ---- かご（たまった桃）シーン ---- */
  .basket-panel{
    display:none;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .basket-panel.show{
    display:flex;
    opacity:1;
    transform:translateY(0);
  }

  .basket-count{
    font-family:'Mochiy Pop One', sans-serif;
    font-size:20px;
    color:var(--teal);
  }

  .basket-stage{
    position:relative;
    width:290px;
    height:270px;
    cursor:pointer;
  }

  .peach-pile{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:180px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    gap:5px;
    z-index:2;
    cursor:pointer;
  }
  .pile-row{
    display:flex;
    justify-content:center;
    gap:5px;
  }
  .peach-pile span{
    width:40px;
    height:40px;
    display:inline-block;
  }
  .mini-peach-svg{ width:100%; height:100%; overflow:visible; }

  @keyframes peachFall{
    0%{ transform:translateY(-60px); opacity:0; }
    60%{ transform:translateY(6px); opacity:1; }
    100%{ transform:translateY(0); opacity:1; }
  }
  .peach-pile span.fall-in{
    animation:peachFall .5s ease-out both;
  }

  .peach-pile.pop{
    animation:basketPop .4s ease;
  }
  @keyframes basketPop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.12) rotate(-2deg); }
    100%{ transform:scale(1); }
  }

  .basket-svg{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:270px;
    height:145px;
    z-index:1;
  }

  .congrats{
    font-family:'Mochiy Pop One', sans-serif;
    font-size:22px;
    color:#fff;
    background:linear-gradient(135deg, #FFCA4A, #FF8FAE);
    border-radius:16px;
    padding:12px 22px;
    letter-spacing:0.03em;
    display:none;
    text-align:center;
  }
  .congrats.show{
    display:block;
    animation:congratsPop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes congratsPop{
    0%{ transform:scale(0.5); opacity:0; }
    70%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
</style>
</head>
<body>

<div class="frame" id="frame">

  <!-- BGMと効果音（ファイルはアップロードして使う） -->
  <audio id="bgmAudio" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="popSound" src="pop.mp3" preload="auto"></audio>
  <button class="sound-toggle" id="soundToggle">
    <svg id="soundIconOn" viewBox="0 0 24 24" width="18" height="18">
      <path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/>
      <path d="M16 8.5c1.2 1 1.2 6 0 7" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M18.5 6.5c2.2 2 2.2 9 0 11" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </svg>
    <svg id="soundIconOff" viewBox="0 0 24 24" width="18" height="18" style="display:none;">
      <path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/>
      <path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- トップ画面 -->
  <div class="panel" id="topPanel">
    <div class="badge">TODAY'S WORD</div>
    <div class="date-tag" id="dateTag"></div>
    <div class="title">MOMO</div>
    <div class="tagline">今日mo明日mo<br>have a nice day.</div>

    <div class="peach-wrap peach-bounce" id="peachBtn">
      <svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="120" rx="34" ry="6" fill="#FFEFE6" opacity="0.6"/>
        <g class="peach-left">
          <path d="M60 30 C34 18 10 40 12 66 C14 92 36 108 60 100 Z" fill="#FFC8B0"/>
          <path d="M60 30 C42 24 24 36 20 54 C34 50 50 42 60 30 Z" fill="#FF9FA8" opacity="0.55"/>
          <circle cx="30" cy="52" r="4" fill="#FFFFFF" opacity="0.7"/>
        </g>
        <g class="peach-right">
          <path d="M60 30 C86 18 110 40 108 66 C106 92 84 108 60 100 Z" fill="#FFB6A8"/>
          <path d="M60 30 C78 24 96 36 100 54 C86 50 70 42 60 30 Z" fill="#FF8F9E" opacity="0.5"/>
          <circle cx="92" cy="46" r="3" fill="#FFFFFF" opacity="0.6"/>
        </g>
        <path d="M44 96 C28 92 18 102 22 114 C34 112 44 104 44 96 Z" fill="#8FBF7A"/>
        <path d="M76 96 C92 92 102 102 98 114 C86 112 76 104 76 96 Z" fill="#79AD66"/>
      </svg>
      <div class="burst-layer" id="burstLayer"></div>
    </div>

    <div class="tap-me" id="tapMe">tap me</div>
  </div>

  <!-- 結果ページ（桃が割れた後、全画面で表示） -->
  <div class="panel result-panel" id="resultPanel">

    <div class="r-header rays">今日のあなたに</div>
    <div class="r-date-big" id="rDateBig"></div>
    <div class="r-date-sub">
      <span id="rYear"></span>
      <span class="r-weekday-pill" id="rWeekday"></span>
    </div>

    <div class="r-cat-pill" id="rCatPill"></div>

    <div class="r-quote" id="rQuote"></div>

    <div class="r-peach-deco">
      <svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="120" rx="34" ry="6" fill="#FFEFE6" opacity="0.6"/>
        <g transform="translate(-16,2) rotate(-8 60 65)">
          <path d="M60 30 C34 18 10 40 12 66 C14 92 36 108 60 100 Z" fill="#FFC8B0"/>
          <path d="M60 30 C42 24 24 36 20 54 C34 50 50 42 60 30 Z" fill="#FF9FA8" opacity="0.55"/>
          <circle cx="30" cy="52" r="4" fill="#FFFFFF" opacity="0.7"/>
        </g>
        <g transform="translate(16,2) rotate(8 60 65)">
          <path d="M60 30 C86 18 110 40 108 66 C106 92 84 108 60 100 Z" fill="#FFB6A8"/>
          <path d="M60 30 C78 24 96 36 100 54 C86 50 70 42 60 30 Z" fill="#FF8F9E" opacity="0.5"/>
          <circle cx="92" cy="46" r="3" fill="#FFFFFF" opacity="0.6"/>
        </g>
        <path d="M44 96 C28 92 18 102 22 114 C34 112 44 104 44 96 Z" fill="#8FBF7A"/>
        <path d="M76 96 C92 92 102 102 98 114 C86 112 76 104 76 96 Z" fill="#79AD66"/>
      </svg>
    </div>

  </div>

  <!-- かご（たまった桃）シーン -->
  <div class="panel basket-panel" id="basketPanel">
    <div class="r-header rays">たまったMOMO</div>
    <div class="basket-count" id="basketCount"></div>

    <div class="basket-stage" id="basketStage">
      <div class="peach-pile" id="peachPile">
        <div class="pile-row" data-cap="1"></div>
        <div class="pile-row" data-cap="2"></div>
        <div class="pile-row" data-cap="3"></div>
        <div class="pile-row" data-cap="4"></div>
        <div class="pile-row" data-cap="5"></div>
      </div>
      <div class="burst-layer" id="basketBurstLayer"></div>
      <svg class="basket-svg" viewBox="0 0 260 140" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="35" cy="58" rx="19" ry="28" fill="none" stroke="#B9824A" stroke-width="9" transform="rotate(-18 35 58)"/>
        <ellipse cx="225" cy="58" rx="19" ry="28" fill="none" stroke="#B9824A" stroke-width="9" transform="rotate(18 225 58)"/>
        <path d="M35 58 C35 100 225 100 225 58 L205 120 C205 120 130 128 130 128 C130 128 55 120 55 120 Z" fill="#E8B478"/>
        <ellipse cx="130" cy="58" rx="95" ry="20" fill="#D9A066"/>
        <path d="M45 72 Q130 92 215 72" stroke="#C98F55" stroke-width="3" fill="none" opacity="0.6"/>
        <path d="M50 92 Q130 110 210 92" stroke="#C98F55" stroke-width="3" fill="none" opacity="0.55"/>
        <path d="M60 110 Q130 124 200 110" stroke="#C98F55" stroke-width="3" fill="none" opacity="0.5"/>
      </svg>
    </div>

    <div class="congrats" id="congratsBanner">CONGRATULATIONS!</div>

    <button class="bonus-link" id="nextToRiverBtn" style="display:inline-block;">次へ ▶</button>
  </div>

  <!-- おまけページ（桃とキャラクターが川を流れてくる） -->
  <div class="panel bonus-panel" id="bonusPanel">
    <button class="close-btn" id="closeBtn">×</button>

    <div class="river-wrap" id="riverWrap">
      <div class="river"></div>
      <div class="river river2"></div>
      <div class="speech-bubble" id="speechBubble"><span id="speechText"></span></div>
    </div>

    <div class="ending-tagline">
      <div class="rays">今日mo明日mo</div>
      <div class="ending-sub">have a nice day.</div>
    </div>
  </div>

</div>

<script>

    return hash;
  }

  function burstConfetti(layerId){

        piece.style.background = confettiColors[i % confettiColors.length];

      // クラッカーみたいに上＆左右に打ち上がるように角度を調整
      const angle = (-90 + (Math.random()*140 - 70)) * Math.PI/180;
      const dist = 60 + Math.random()*70;

      const y = Math.sin(angle) * dist;

      layer.appendChild(piece);

      piece.animate(
        [

          { transform:`translate(-50%,-50%) translate(${x*0.6}px, ${y*0.6}px) rotate(${rot}deg) scale(1)`, opacity:1, offset:0.5 },
          { transform:`translate(-50%,-50%) translate(${x}px, ${y + 40}px) rotate(${rot*1.4}deg) scale(0.8)`, opacity:0 }

        { duration: 900 + Math.random()*400, easing:'cubic-bezier(.2,.8,.3,1)', fill:'forwards' }
      );
    }
  }

  // 表示幅を測って、できるだけ句読点の位置で綺麗に改行する
  function smartWrapQuote(text, el){
    const style = getComputedStyle(el);
    const canvas = smartWrapQuote._canvas || (smartWrapQuote._canvas = document.createElement('canvas'));
    const ctx = canvas.getContext('2d');
    ctx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
    const paddingL = parseFloat(style.paddingLeft) || 0;
    const paddingR = parseFloat(style.paddingRight) || 0;
    const maxWidth = el.clientWidth - paddingL - paddingR;

    if(!maxWidth || ctx.measureText(text).width <= maxWidth) return text;

    // 、や。の直後を改行候補にする（最後の文字は除く）
    const candidates = [];
    for(let i=0;i<text.length-1;i++){
      if(text[i] === '、' || text[i] === '。') candidates.push(i+1);
    }

    let best = null, bestScore = Infinity;
    candidates.forEach(function(idx){
      const a = text.slice(0, idx);
      const b = text.slice(idx);
      if(ctx.measureText(a).width <= maxWidth && ctx.measureText(b).width <= maxWidth){
        const score = Math.abs(a.length - b.length);
        if(score < bestScore){ bestScore = score; best = idx; }
      }
    });

    if(best !== null){
      return text.slice(0, best) + '\n' + text.slice(best);
    }

    // 句読点でうまく収まらない場合は、幅ぴったりで機械的に折り返す
    let lines = [];
    let current = '';
    for(const ch of text){
      const test = current + ch;
      if(ctx.measureText(test).width > maxWidth && current){
        lines.push(current);
        current = ch;
      } else {
        current = test;
      }
    }
    if(current) lines.push(current);
    return lines.join('\n');
  }

    const raw = totalDays || 1;

    countEl.textContent = `全部で ${n}個`;
    pile.innerHTML = '';

    let remaining = n;
    let globalIndex = 0;
    PYRAMID_ROWS.forEach(function(cap){
      const row = document.createElement('div');
      row.className = 'pile-row';
      const fillCount = Math.max(0, Math.min(cap, remaining));
      for(let i=0;i<fillCount;i++){
        const span = document.createElement('span');
        span.innerHTML = MINI_PEACH_SVG;
        span.classList.add('fall-in');
        span.style.animationDelay = (globalIndex * 0.06) + 's';

        globalIndex++;
      }
      remaining -= fillCount;
      pile.appendChild(row);

      congratsEl.classList.remove('show');

  }

    '<svg viewBox="0 0 24 24"><path d="M12 2c.6 3.6 1.8 4.8 5.4 5.4-3.6.6-4.8 1.8-5.4 5.4-.6-3.6-1.8-4.8-5.4-5.4C10.2 6.8 11.4 5.6 12 2zM19 14c.3 1.8.9 2.4 2.7 2.7-1.8.3-2.4.9-2.7 2.7-.3-1.8-.9-2.4-2.7-2.7 1.8-.3 2.4-.9 2.7-2.7z" fill="#3FC6C2"/></svg>',
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#FF6B95"/><rect x="10.5" y="5" width="3" height="9" rx="1.5" fill="#fff"/><rect x="10.5" y="16" width="3" height="3" rx="1.5" fill="#fff"/></svg>'
  ];

  function getRiverItemPos(item){
    const wrapRect = riverWrap.getBoundingClientRect();
    const itemRect = item.getBoundingClientRect();
    return {
      left: itemRect.left - wrapRect.left + itemRect.width/2,
      top: itemRect.top - wrapRect.top + itemRect.height/2
    };
  }

  function popPeachItem(item){
    if(item.classList.contains('split')) return; // 割れてる間は連打しない
    if(item._anim) item._anim.pause();
    item.classList.add('split');
    playPop();

    const pos = getRiverItemPos(item);

    setTimeout(function(){
      const praise = praises[Math.floor(Math.random()*praises.length)];
      speechText.textContent = praise;
      speechBubble.style.left = pos.left + 'px';
      speechBubble.style.top = Math.max(4, pos.top - 92) + 'px';
      speechBubble.classList.add('show');
    }, 350);

    setTimeout(function(){
      speechBubble.classList.remove('show');
      if(item._anim) item._anim.play();
    }, 2400);
  }

  function popCharacterItem(item){
    playPop();
    const pos = getRiverItemPos(item);
    const mark = document.createElement('div');
    mark.className = 'pop-mark';
    mark.innerHTML = POP_MARK_SVGS[Math.floor(Math.random()*POP_MARK_SVGS.length)];
    mark.style.left = pos.left + 'px';
    mark.style.top = pos.top + 'px';
    riverWrap.appendChild(mark);
    setTimeout(function(){ mark.remove(); }, 1000);
  }

  function spawnRiverItem(){
    if(!riverWrap) return;
    const isPeach = Math.random() < 0.55;
    const item = document.createElement('div');
    item.className = 'river-item';

    if(isPeach){
      item.innerHTML = RIVER_PEACH_SVG;
      item.addEventListener('click', function(){ popPeachItem(item); });
    } else {
      const name = charNames[Math.floor(Math.random()*charNames.length)];
      const img = document.createElement('img');
      img.src = charImages[name];
      item.appendChild(img);
      item.addEventListener('click', function(){ popCharacterItem(item); });
    }

    const topPos = 40 + Math.random()*110; // 川の帯の範囲内
    item.style.top = topPos + 'px';
    item.style.left = '-60px';
    riverWrap.appendChild(item);

    const duration = 7000 + Math.random()*2500;
    const wrapWidth = riverWrap.clientWidth;
    const anim = item.animate(
      [
        { left: '-60px', transform: 'rotate(-6deg)' },
        { left: (wrapWidth*0.5) + 'px', transform: 'rotate(6deg)', offset:0.5 },
        { left: (wrapWidth + 60) + 'px', transform: 'rotate(-6deg)' }
      ],
      { duration: duration, easing: 'linear' }
    );
    item._anim = anim;
    anim.onfinish = function(){ item.remove(); };
  }

  function startRiverScene(){
    stopRiverScene();
    for(let i=0;i<2;i++){
      setTimeout(spawnRiverItem, i*900);
    }
    riverSpawnTimer = setInterval(spawnRiverItem, 4000);
  }

  function stopRiverScene(){
    if(riverSpawnTimer) clearInterval(riverSpawnTimer);
    riverSpawnTimer = null;
    if(riverWrap) riverWrap.querySelectorAll('.river-item, .pop-mark').forEach(function(el){ el.remove(); });
    speechBubble.classList.remove('show');
  }

  peachBtn.addEventListener('click', reveal);
  closeBtn.addEventListener('click', closeResult);
</script>

</body>
</html>
